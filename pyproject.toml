[project]
name = "audio2inst"
version = "0.1.0"
description = "Turn any audio into a playable drum instrument via unsupervised clustering."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "scikit-learn>=1.3",
    "python-rtmidi>=1.5",
]

# The CLAP+Pitch classifier model needs pretrained audio embeddings. Optional so
# the core clustering/hand-crafted-classifier app stays lightweight:
#   pip install -e ".[clap]"
[project.optional-dependencies]
clap = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.scripts]
samplebot-3000 = "main:main"
audio2inst = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: every top-level module must be listed or it is silently left out
# of the built wheel. Keep in sync when adding a module (the app imports these by
# bare name, so a missing entry breaks a non-editable install).
py-modules = ["acoustic_eval", "adsr_widget", "audio_engine", "autosort_bakeoff",
    "autosort_eval_kit", "classifier", "datasets_loader", "drum_data", "embed_eval",
    "embedders", "exs_templates", "fx_reject", "gui", "hybrid_classifier", "kit_store",
    "lexicon", "logic_export", "logic_import", "loudness", "main", "midi_input",
    "model_analysis", "moog_widgets", "normalize_names", "piano_widget", "pipeline",
    "preprocess_diag", "recategorize_dialog", "sort_samples", "train_hybrid",
    "waveform_editor"]
